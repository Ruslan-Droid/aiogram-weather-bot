name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to rollback to'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
    - name: Rollback on Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          cd /opt/weather-telegram-bot
          git fetch origin
          git reset --hard ${{ github.event.inputs.commit_hash }}
          
          sudo systemctl restart weather-telegram-bot.service
          sudo systemctl restart weather-telegram-bot-worker.service
          sudo systemctl restart weather-telegram-bot-scheduler.service