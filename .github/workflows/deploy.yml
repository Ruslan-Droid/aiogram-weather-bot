name: Deploy Weather Bot to Server

on:
  push:
    branches: [ master ]
  workflow_dispatch:

env:
  PROJECT_DIR: "/opt/weather-telegram-bot"
  SERVICE_NAME: "weather-telegram-bot"
  WORKER_SERVICE_NAME: "weather-telegram-bot-worker"
  SCHEDULER_SERVICE_NAME: "weather-telegram-bot-scheduler"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Python code
        run: |
          echo "🔍 Проверка синтаксиса Python..."
          python -m py_compile src/**/*.py || true

      - name: Validate Docker Compose
        run: |
          echo "🐳 Проверка docker-compose.yml..."

          # 1. Устанавливаем Docker Compose (если его нет)
          if ! command -v docker-compose &> /dev/null; then
            echo "Устанавливаем Docker Compose..."
            DOCKER_COMPOSE_VERSION=$(curl -s https://api.github.com/repos/docker/compose/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
            sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" \
              -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
          fi

          # 2. Проверяем файл docker-compose.yml
          if [ -f "docker-compose.yml" ]; then
            docker-compose config --quiet
            echo "✅ docker-compose.yml валиден"
          else
            echo "⚠️ docker-compose.yml не найден"
          fi

      - name: Install and Start Tunnelmole
        run: |
          # Устанавливаем Tunnelmole глобально
          npm install -g tunnelmole
          # Запускаем туннель на порту 8000 (или на том, который слушает ваш бот) в фоне
          tmole 8000 > tunnel_output.txt 2>&1 &
          sleep 5 # Даем время на запуск
          # Извлекаем публичный URL из вывода
          TUNNEL_URL=$(grep -o 'https://[^ ]*.tunnelmole.net' tunnel_output.txt | head -n1)
          # Сохраняем URL в переменную окружения для последующих шагов
          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "Public URL for webhook: $TUNNEL_URL"

      - name: Update .env on Server with Webhook URL
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ env.PROJECT_DIR }}
            # Добавляем или заменяем переменную WEBHOOK_BASE_URL в .env файле
            if grep -q "WEBHOOK_BASE_URL" .env; then
              sed -i "s|WEBHOOK_BASE_URL=.*|WEBHOOK_BASE_URL=${{ env.TUNNEL_URL }}/webhook|" .env
            else
              echo "WEBHOOK_BASE_URL=${{ env.TUNNEL_URL }}/webhook" >> .env
            fi
            echo "Updated .env file with webhook URL: ${{ env.TUNNEL_URL }}/webhook"

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            # 1. Проверка и создание директории
            echo "📁 Проверяем директорию ${{ env.PROJECT_DIR }}"
            if [ ! -d "${{ env.PROJECT_DIR }}" ]; then
              echo "Создаем директорию..."
              sudo mkdir -p ${{ env.PROJECT_DIR }}
              sudo chown -R $USER:$USER ${{ env.PROJECT_DIR }}
            fi
            
            # 2. Копирование проекта
            echo "🚀 Копируем файлы..."
            rsync -avz --delete \
              --exclude '.git/' \
              --exclude '__pycache__/' \
              --exclude '*.pyc' \
              --exclude '.env*' \
              --exclude 'venv/' \
              ./ ${{ env.PROJECT_DIR }}/
            
            # Копируем .env отдельно, если существует локально
            if [ -f ".env" ]; then
              echo "⚠️ Обнаружен .env локально. Убедитесь, что .env настроен на сервере!"
            fi
            
            # 3. Настройка systemd сервисов
            echo "⚙️ Настраиваем systemd сервисы..."
            
            # Основной сервис бота
            sudo tee /etc/systemd/system/${{ env.SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Telegram Bot
            After=network.target docker.service
            Requires=docker.service
            Wants=network-online.target
            
            [Service]
            Type=exec
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=500
            StartLimitBurst=5
            
            # Запуск через docker-compose
            ExecStart=/usr/local/bin/docker-compose up --remove-orphans
            ExecStop=/usr/local/bin/docker-compose down
            ExecReload=/usr/local/bin/docker-compose restart
            
            # Ограничения ресурсов
            MemoryLimit=512M
            CPUQuota=80%
            
            # Логирование
            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=${{ env.SERVICE_NAME }}
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Сервис для TaskIQ Worker
            sudo tee /etc/systemd/system/${{ env.WORKER_SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Bot TaskIQ Worker
            After=${{ env.SERVICE_NAME }}.service
            Requires=${{ env.SERVICE_NAME }}.service
            
            [Service]
            Type=simple
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            
            # Активируем виртуальное окружение и запускаем worker
            ExecStart=/bin/bash -c 'cd ${{ env.PROJECT_DIR }} && \
              if [ -f "venv/bin/activate" ]; then \
                source venv/bin/activate && \
                taskiq worker src.services.scheduler.taskiq_broker:broker -fsd; \
              else \
                taskiq worker src.services.scheduler.taskiq_broker:broker -fsd; \
              fi'
            
            Environment="PYTHONUNBUFFERED=1"
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Сервис для TaskIQ Scheduler
            sudo tee /etc/systemd/system/${{ env.SCHEDULER_SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Bot TaskIQ Scheduler
            After=${{ env.WORKER_SERVICE_NAME }}.service
            Requires=${{ env.WORKER_SERVICE_NAME }}.service
            
            [Service]
            Type=simple
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            
            # Активируем виртуальное окружение и запускаем scheduler
            ExecStart=/bin/bash -c 'cd ${{ env.PROJECT_DIR }} && \
              if [ -f "venv/bin/activate" ]; then \
                source venv/bin/activate && \
                taskiq scheduler src.services.scheduler.taskiq_broker:scheduler; \
              else \
                taskiq scheduler src.services.scheduler.taskiq_broker:scheduler; \
              fi'
            
            Environment="PYTHONUNBUFFERED=1"
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 4. Установка прав
            echo "🔒 Настраиваем права..."
            sudo chmod 644 /etc/systemd/system/${{ env.SERVICE_NAME }}.service
            sudo chmod 644 /etc/systemd/system/${{ env.WORKER_SERVICE_NAME }}.service
            sudo chmod 644 /etc/systemd/system/${{ env.SCHEDULER_SERVICE_NAME }}.service
            
            # 5. Загрузка systemd конфигурации
            echo "🔄 Перезагружаем systemd..."
            sudo systemctl daemon-reload
            
            # 6. Запуск docker-compose
            echo "🐳 Запускаем Docker Compose..."
            cd ${{ env.PROJECT_DIR }}
            
            # Проверяем наличие docker-compose.yml
            if [ -f "docker-compose.yml" ]; then
              # Останавливаем старые контейнеры
              docker-compose down --remove-orphans || true
            
              # Строим и запускаем
              docker-compose up -d --build --remove-orphans
            
              # Проверяем статус
              sleep 5
              docker-compose ps
            else
              echo "⚠️ docker-compose.yml не найден, пропускаем этот шаг"
            fi
            
            # 7. Включение и перезапуск сервисов
            echo "🚀 Запускаем сервисы..."
            
            # Основной сервис
            sudo systemctl enable ${{ env.SERVICE_NAME }}.service
            sudo systemctl restart ${{ env.SERVICE_NAME }}.service
            
            # TaskIQ сервисы
            sudo systemctl enable ${{ env.WORKER_SERVICE_NAME }}.service
            sudo systemctl enable ${{ env.SCHEDULER_SERVICE_NAME }}.service
            
            sudo systemctl restart ${{ env.WORKER_SERVICE_NAME }}.service
            sudo systemctl restart ${{ env.SCHEDULER_SERVICE_NAME }}.service
            
            # 8. Проверка статуса
            echo "📊 Статус сервисов:"
            echo "=== Основной бот ==="
            sudo systemctl status ${{ env.SERVICE_NAME }}.service --no-pager -l || true
            
            echo "=== TaskIQ Worker ==="
            sudo systemctl status ${{ env.WORKER_SERVICE_NAME }}.service --no-pager -l || true
            
            echo "=== TaskIQ Scheduler ==="
            sudo systemctl status ${{ env.SCHEDULER_SERVICE_NAME }}.service --no-pager -l || true
            
            # 9. Проверка логов
            echo "📋 Последние логи:"
            journalctl -u ${{ env.SERVICE_NAME }} -n 10 --no-pager || true
            
            echo "✅ Деплой завершен!"

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🏥 Выполняем health check..."
            
            # Проверяем, что сервисы активны
            if systemctl is-active --quiet ${{ env.SERVICE_NAME }}.service; then
              echo "✅ Основной сервис работает"
            else
              echo "❌ Основной сервис не работает"
              exit 1
            fi
            
            # Ждем 30 секунд для полного запуска
            sleep 30
            
            # Проверяем Docker контейнеры
            if [ -f "${{ env.PROJECT_DIR }}/docker-compose.yml" ]; then
              echo "🐳 Проверяем контейнеры..."
              cd ${{ env.PROJECT_DIR }}
              docker-compose ps | grep -v "Exit"
            fi
            
            echo "🎉 Все проверки пройдены!"