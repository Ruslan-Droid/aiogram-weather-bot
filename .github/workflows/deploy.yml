name: Deploy Weather Bot to Server

on:
  push:
    branches: [ master ]

env:
  PROJECT_DIR: "/home/root/projects/Weather-telegram-bot"
  SERVICE_NAME: "weather-telegram-bot"
  WORKER_SERVICE_NAME: "weather-telegram-bot-worker"
  SCHEDULER_SERVICE_NAME: "weather-telegram-bot-scheduler"

jobs:
  deploy: # name for jub
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lint Python code
        run: |
          echo "🔍 Проверка Python файлов..."
          find src -name "*.py" -exec python -m py_compile {} \; 2>/dev/null || echo "Незначительные ошибки синтаксиса проигнорированы"

      - name: Check and Install Docker on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo "🔧 Проверяем установку Docker..."
            # Проверяем Docker
            if ! command -v docker &> /dev/null; then
              echo "Устанавливаем Docker..."
              # Для Ubuntu/Debian
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /usr/share/keyrings/docker-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            
              # Добавляем пользователя в группу docker
              sudo usermod -aG docker $USER
              echo "⚠️ Требуется перелогин для применения прав docker. Запустите 'newgrp docker' или перезайдите в систему."
            else
              echo "✅ Docker уже установлен"
            fi
            
            # Проверяем Docker Compose
            if ! command -v docker-compose &> /dev/null; then
              echo "Устанавливаем Docker Compose..."
              DOCKER_COMPOSE_VERSION="v2.29.1"
              sudo curl -L "https://github.com/docker/compose/releases/download/${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" \
                -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            else
              echo "✅ Docker Compose уже установлен"
            fi
            
            echo "Версии:"
            docker --version
            docker-compose --version

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            # 1. Проверка и создание директории
            echo "📁 Проверяем директорию ${{ env.PROJECT_DIR }}"
            if [ ! -d "${{ env.PROJECT_DIR }}" ]; then
              echo "Создаем директорию..."
              sudo mkdir -p "${{ env.PROJECT_DIR }}"
              sudo chown -R $USER:$USER "${{ env.PROJECT_DIR }}"
            fi
            
            # 2. Копирование проекта
            echo "🚀 Копируем файлы..."
            rsync -avz --delete \
              --exclude '.git/' \
              --exclude '__pycache__/' \
              --exclude '*.pyc' \
              --exclude '.env*' \
              --exclude 'venv/' \
              --exclude '.github/' \
              ./ "${{ env.PROJECT_DIR }}/"
            
            echo "✅ Файлы скопированы"

      - name: Setup Systemd Services and Start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            # 1. Настройка systemd сервисов
            echo "⚙️ Настраиваем systemd сервисы..."
            
            # Основной сервис бота
            sudo tee /etc/systemd/system/${{ env.SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Telegram Bot
            After=network.target docker.service
            Requires=docker.service
            Wants=network-online.target
            
            [Service]
            Type=exec
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            StartLimitIntervalSec=500
            StartLimitBurst=5
            
            # Запуск через docker-compose
            ExecStart=/usr/local/bin/docker-compose up --remove-orphans
            ExecStop=/usr/local/bin/docker-compose down
            ExecReload=/usr/local/bin/docker-compose restart
            
            # Ограничения ресурсов
            MemoryLimit=512M
            CPUQuota=80%
            
            # Логирование
            StandardOutput=journal
            StandardError=journal
            SyslogIdentifier=${{ env.SERVICE_NAME }}
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Сервис для TaskIQ Worker
            sudo tee /etc/systemd/system/${{ env.WORKER_SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Bot TaskIQ Worker
            After=${{ env.SERVICE_NAME }}.service
            Requires=${{ env.SERVICE_NAME }}.service
            
            [Service]
            Type=simple
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            
            # Активируем виртуальное окружение и запускаем worker
            ExecStart=/bin/bash -c 'cd ${{ env.PROJECT_DIR }} && \
              if [ -f "venv/bin/activate" ]; then \
                source venv/bin/activate && \
                taskiq worker src.services.scheduler.taskiq_broker:broker -fsd; \
              else \
                taskiq worker src.services.scheduler.taskiq_broker:broker -fsd; \
              fi'
            
            Environment="PYTHONUNBUFFERED=1"
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # Сервис для TaskIQ Scheduler
            sudo tee /etc/systemd/system/${{ env.SCHEDULER_SERVICE_NAME }}.service > /dev/null << EOF
            [Unit]
            Description=Weather Bot TaskIQ Scheduler
            After=${{ env.WORKER_SERVICE_NAME }}.service
            Requires=${{ env.WORKER_SERVICE_NAME }}.service
            
            [Service]
            Type=simple
            WorkingDirectory=${{ env.PROJECT_DIR }}
            User=$USER
            Group=$USER
            Restart=always
            RestartSec=10
            
            # Активируем виртуальное окружение и запускаем scheduler
            ExecStart=/bin/bash -c 'cd ${{ env.PROJECT_DIR }} && \
              if [ -f "venv/bin/activate" ]; then \
                source venv/bin/activate && \
                taskiq scheduler src.services.scheduler.taskiq_broker:scheduler; \
              else \
                taskiq scheduler src.services.scheduler.taskiq_broker:scheduler; \
              fi'
            
            Environment="PYTHONUNBUFFERED=1"
            
            [Install]
            WantedBy=multi-user.target
            EOF
            
            # 2. Установка прав
            echo "🔒 Настраиваем права..."
            sudo chmod 644 /etc/systemd/system/${{ env.SERVICE_NAME }}.service
            sudo chmod 644 /etc/systemd/system/${{ env.WORKER_SERVICE_NAME }}.service
            sudo chmod 644 /etc/systemd/system/${{ env.SCHEDULER_SERVICE_NAME }}.service
            
            # 3. Загрузка systemd конфигурации
            echo "🔄 Перезагружаем systemd..."
            sudo systemctl daemon-reload
            
            # 4. Запуск docker-compose
            echo "🐳 Запускаем Docker Compose..."
            cd "${{ env.PROJECT_DIR }}"
            
            if [ -f "docker-compose.yml" ]; then
              # Останавливаем старые контейнеры
              echo "Останавливаем старые контейнеры..."
              sudo docker-compose down --remove-orphans || true
            
              # Строим и запускаем
              echo "Собираем и запускаем контейнеры..."
              sudo docker-compose up -d --build --remove-orphans
            
              # Проверяем статус
              sleep 10
              echo "Статус контейнеров:"
              sudo docker-compose ps
            else
              echo "⚠️ docker-compose.yml не найден"
            fi
            
            # 5. Включение и перезапуск сервисов
            echo "🚀 Настраиваем автозапуск сервисов..."
            
            # Основной сервис
            sudo systemctl enable ${{ env.SERVICE_NAME }}.service || true
            sudo systemctl restart ${{ env.SERVICE_NAME }}.service || true
            
            # TaskIQ сервисы
            sudo systemctl enable ${{ env.WORKER_SERVICE_NAME }}.service || true
            sudo systemctl enable ${{ env.SCHEDULER_SERVICE_NAME }}.service || true
            
            sudo systemctl restart ${{ env.WORKER_SERVICE_NAME }}.service || true
            sudo systemctl restart ${{ env.SCHEDULER_SERVICE_NAME }}.service || true
            
            # 6. Проверка статуса
            echo "📊 Статус сервисов:"
            echo "=== Основной бот ==="
            sudo systemctl status ${{ env.SERVICE_NAME }}.service --no-pager -l | head -20 || true
            
            echo "=== TaskIQ Worker ==="
            sudo systemctl status ${{ env.WORKER_SERVICE_NAME }}.service --no-pager -l | head -20 || true
            
            echo "=== TaskIQ Scheduler ==="
            sudo systemctl status ${{ env.SCHEDULER_SERVICE_NAME }}.service --no-pager -l | head -20 || true
            
            echo "✅ Системные сервисы настроены"

      - name: Update Telegram Webhook
        run: |
          echo "🔧 Обновляем вебхук в Telegram..."
          
          # Получаем публичный IP сервера из секретов
          SERVER_IP="${{ secrets.SERVER_HOST }}"
          
          # Проверяем, есть ли токен бота в секретах
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            # Формируем URL вебхука (предполагаем порт 8080, измените если нужно)
            WEBHOOK_URL="http://${SERVER_IP}:8080/webhook"
          
            echo "Используем URL вебхука: $WEBHOOK_URL"
            echo "Для продакшена рекомендуется настроить HTTPS и домен!"
          
            # Обновляем вебхук через API Telegram
            # Закомментируйте следующую строку, если пока не хотите обновлять вебхук
            # curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook?url=${WEBHOOK_URL}" || echo "Не удалось обновить вебхук"
          
            # Для отладки выводим команду
            echo "Команда для обновления вебхука:"
            echo "curl -X POST \"https://api.telegram.org/bot\${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook?url=${WEBHOOK_URL}\""
          else
            echo "⚠️ TELEGRAM_BOT_TOKEN не установлен в секретах GitHub"
            echo "Добавьте TELEGRAM_BOT_TOKEN в Secrets для автоматического обновления вебхука"
          fi

      - name: Health Check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "🏥 Выполняем health check..."
            
            # Проверяем, что сервисы активны
            if systemctl is-active --quiet ${{ env.SERVICE_NAME }}.service; then
              echo "✅ Основной сервис работает"
            else
              echo "❌ Основной сервис не работает"
              sudo journalctl -u ${{ env.SERVICE_NAME }}.service -n 20 --no-pager || true
              exit 1
            fi
            
            # Ждем 30 секунд для полного запуска
            echo "⏳ Ждем полного запуска..."
            sleep 30
            
            # Проверяем Docker контейнеры
            if [ -f "${{ env.PROJECT_DIR }}/docker-compose.yml" ]; then
              echo "🐳 Проверяем контейнеры..."
              cd "${{ env.PROJECT_DIR }}"
              sudo docker-compose ps
            
              # Проверяем логи последних 5 минут
              echo "📋 Логи контейнеров за последние 5 минут:"
              sudo docker-compose logs --tail=20 --since=5m || true
            fi
            
            echo "🎉 Все проверки пройдены!"