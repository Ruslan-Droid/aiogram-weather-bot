name: Create Release
on:
  push:
    tags:
      - "v*.*.*"
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create clean source archive
        run: |
            tar -czf source-code.tar.gz \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='.venv' \
              --exclude='node_modules' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              --exclude='.env*' \
              --exclude='*.pem' \
              --exclude='*.key' \
              --exclude='.pytest_cache' \
              --exclude='.coverage' \
              --exclude='htmlcov' \
              --exclude='.idea' \
              --exclude='.vscode' \
              .

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: source-code.tar.gz